spring.application.name=trainer-workload-service

server.port=8082

# The monthly summaries live only in memory; DB_CLOSE_DELAY keeps the database alive
# between connections for the lifetime of the JVM.
spring.datasource.url=jdbc:h2:mem:trainer-workload;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

# Must match gym-crm-core: it signs the service tokens this service verifies.
gym.security.jwt.secret=${JWT_SECRET:local-development-only-secret-change-me}
gym.security.jwt.issuer=gym-crm

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
