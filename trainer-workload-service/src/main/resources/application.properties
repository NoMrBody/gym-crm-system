spring.application.name=trainer-workload-service

server.port=8082

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/trainer_workload}
spring.data.mongodb.auto-index-creation=true

# to print the queries and updates sent to MongoDB. Local debugging only.
#logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

spring.activemq.broker-url=${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
gym.workload.queue=gym.trainer.workload

# Must match gym-crm-core: it signs the service tokens this service verifies.
gym.security.jwt.secret=${JWT_SECRET:local-development-only-secret-change-me}
gym.security.jwt.issuer=gym-crm

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
