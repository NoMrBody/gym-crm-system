spring.datasource.url=jdbc:h2:mem:trainer-workload-test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

spring.h2.console.enabled=false

# No registry is running during tests.
eureka.client.enabled=false
spring.cloud.discovery.enabled=false

gym.security.jwt.secret=integration-test-secret-key-that-is-long-enough
gym.security.jwt.issuer=gym-crm
