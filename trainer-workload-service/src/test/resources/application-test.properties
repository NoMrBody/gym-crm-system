spring.data.mongodb.auto-index-creation=true

# No registry is running during tests. The VM broker comes from activemq-broker on the test classpath.
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
spring.activemq.broker-url=vm://localhost?broker.persistent=false
gym.workload.queue=gym.trainer.workload

gym.security.jwt.secret=integration-test-secret-key-that-is-long-enough
gym.security.jwt.issuer=gym-crm
