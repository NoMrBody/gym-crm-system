spring.datasource.url=jdbc:postgresql://${DB_HOST:dev-db.example.com}:${DB_PORT:5432}/${DB_NAME:gym-crm-dev}
spring.datasource.username=${DB_USERNAME:dev_user}
spring.datasource.password=${DB_PASSWORD:dev_password}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.datasource.hikari.maximum-pool-size=10

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

gym.security.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-at-least-32-bytes}
gym.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
