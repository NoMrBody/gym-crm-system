spring.application.name=discovery-server

server.port=8761

# The registry itself is standalone: it neither registers with nor fetches from a peer.
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# Self-preservation hides stale instances during local restarts; keep it off outside production.
eureka.server.enable-self-preservation=false

logging.pattern.level=%5p [txId=%X{transactionId:-N/A}]
