spring.datasource.url=jdbc:h2:mem:gym-crm-test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

gym.security.jwt.secret=integration-test-secret-key-that-is-long-enough
gym.security.jwt.issuer=gym-crm
gym.security.jwt.ttl=1h

gym.security.brute-force.max-attempts=3
gym.security.brute-force.block-duration=5m

gym.security.cors.allowed-origins=http://localhost:3000

# No registry is running during tests, and the workload client is always mocked. The base URL
# points nowhere on purpose, so a missed mock fails fast instead of reaching a real service.
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
spring.http.serviceclient.trainerWorkload.base-url=http://localhost:1
