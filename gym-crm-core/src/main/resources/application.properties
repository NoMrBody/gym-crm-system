spring.application.name=gym-crm

spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

gym.metrics.refresh-ms=30000

gym.health.auth.min-attempts=10
gym.health.auth.max-failure-ratio=0.5

# HS256 needs at least 32 bytes. Every environment except local must supply its own secret.
gym.security.jwt.secret=${JWT_SECRET:local-development-only-secret-change-me}
gym.security.jwt.issuer=gym-crm
gym.security.jwt.ttl=1h

gym.security.brute-force.max-attempts=3
gym.security.brute-force.block-duration=5m

gym.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true

spring.activemq.broker-url=${ACTIVEMQ_BROKER_URL:tcp://localhost:61616}
gym.workload.queue=gym.trainer.workload

# Opens after 5 of the last 10 sends fail, so a broker outage stops being retried.
resilience4j.circuitbreaker.instances.trainerWorkload.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.trainerWorkload.sliding-window-size=10
resilience4j.circuitbreaker.instances.trainerWorkload.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.trainerWorkload.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.trainerWorkload.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.trainerWorkload.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.trainerWorkload.automatic-transition-from-open-to-half-open-enabled=true

management.health.circuitbreakers.enabled=true

